    <style>
      /* The house intro: drawn before any script, lifted once the page is ready. */
      #kl-intro {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(120% 80% at 50% 45%, #1a1613 0%, #0c0a09 60%, #070605 100%);
        color: #f2ebdc; font: 400 10px/1 Helvetica, Arial, sans-serif;
        clip-path: inset(0 0 0 0);
        transition: clip-path 1.15s cubic-bezier(0.83, 0, 0.17, 1);
      }
      #kl-intro.kl-lift { clip-path: inset(0 0 100% 0); }
      #kl-intro .kl-stage { display: flex; flex-direction: column; align-items: center; transition: transform 1.15s cubic-bezier(0.83, 0, 0.17, 1), opacity 0.6s ease; }
      #kl-intro.kl-lift .kl-stage { transform: translateY(-14vh); opacity: 0; }
      /* The mark, then a band of light passing across it. */
      #kl-intro .kl-mark {
        position: relative; width: 148px; aspect-ratio: 807 / 351;
        opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px);
        animation: kl-rise 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }
      #kl-intro .kl-mark img { width: 100%; height: 100%; display: block; opacity: 0.92; }
      #kl-intro .kl-sheen {
        position: absolute; inset: 0;
        -webkit-mask: url(/images/kiano-lockup-mark.png) center / 100% 100% no-repeat;
        mask: url(/images/kiano-lockup-mark.png) center / 100% 100% no-repeat;
        background: linear-gradient(105deg, transparent 35%, #fff8e6 50%, transparent 65%) no-repeat;
        background-size: 250% 100%; background-position: 130% 0;
        animation: kl-sheen 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.75s forwards;
      }
      #kl-intro .kl-word {
        margin-top: 16px; text-transform: uppercase;
        letter-spacing: 1.1em; padding-left: 1.1em; opacity: 0;
        animation: kl-settle 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
      }
      #kl-intro .kl-line {
        margin-top: 28px; width: 132px; height: 1px; background: rgba(242, 235, 220, 0.14); position: relative;
      }
      #kl-intro .kl-line i {
        position: absolute; inset: 0; background: #e7dcc4; transform: scaleX(0); transform-origin: left;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #kl-intro .kl-foot {
        position: absolute; left: 0; right: 0; bottom: 28px; padding: 0 32px;
        display: flex; justify-content: space-between; align-items: baseline;
        text-transform: uppercase; letter-spacing: 0.32em; color: rgba(242, 235, 220, 0.5);
        opacity: 0; animation: kl-fade 1s ease 0.6s forwards;
      }
      #kl-intro .kl-count { font-variant-numeric: tabular-nums; letter-spacing: 0.2em; color: rgba(242, 235, 220, 0.75); }
      @keyframes kl-rise { to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes kl-sheen { to { background-position: -30% 0; } }
      @keyframes kl-settle { to { opacity: 0.7; letter-spacing: 0.5em; padding-left: 0.5em; } }
      @keyframes kl-fade { to { opacity: 1; } }
      /* The first photograph waits behind the curtain, then fades and settles as it lifts. */
      html.kl-hold .still-drift, html.kl-hold .still-in { animation-play-state: paused !important; }
      @media (max-width: 640px) { #kl-intro .kl-foot { padding: 0 20px; bottom: 22px; } #kl-intro .kl-made { display: none; } }
      @media (prefers-reduced-motion: reduce) { #kl-intro { display: none; } }
    </style>

  <body>
    <div id="kl-intro" aria-hidden="true">
      <div class="kl-stage">
        <div class="kl-mark"><img src="/images/kiano-lockup-mark.png" alt="" width="807" height="351" /><span class="kl-sheen"></span></div>
        <span class="kl-word">London</span>
        <span class="kl-line"><i></i></span>
      </div>
      <div class="kl-foot"><span class="kl-made">Handmade in the UAE</span><span class="kl-count">000</span></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('kl-intro')
        var root = document.documentElement
        var skip = /^\/(admin|checkout|order|sign-in|sign-up|api)/.test(location.pathname)
        var seen = false
        try { seen = sessionStorage.getItem('kl.intro') === '1' } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!el) return
        if (skip || seen || reduce) { el.parentNode.removeChild(el); return }
        try { sessionStorage.setItem('kl.intro', '1') } catch (e) {}
        root.style.overflow = 'hidden'
        root.classList.add('kl-hold')
        var count = el.querySelector('.kl-count')
        var bar = el.querySelector('.kl-line i')
        var start = Date.now()
        var ready = false
        var shown = 0
        var done = false
        // Count to 100: eases toward 90 while loading, finishes once the page is ready.
        function tick() {
          if (done) return
          var t = Date.now() - start
          var target = ready && t > 1700 ? 100 : Math.min(90, 90 * (1 - Math.pow(1 - Math.min(t / 1800, 1), 3)))
          shown += (target - shown) * (ready ? 0.22 : 0.12)
          if (target - shown < 0.6) shown = target
          var n = Math.round(shown)
          count.textContent = (n < 10 ? '00' : n < 100 ? '0' : '') + n
          bar.style.transform = 'scaleX(' + shown / 100 + ')'
          if (n >= 100) { done = true; setTimeout(lift, 260); return }
          requestAnimationFrame(tick)
        }
        requestAnimationFrame(tick)
        function lift() {
          el.classList.add('kl-lift')
          root.style.overflow = ''
          root.classList.remove('kl-hold')
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el)
          }, 1300)
        }
        window.__klIntroReady = function () { ready = true }
        setTimeout(function () { ready = true }, 4000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
