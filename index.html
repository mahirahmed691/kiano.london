    <style>
      /* The house intro: drawn before any script, lifted once the page is ready. */
      #kl-intro {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0c0a09; color: #f2ebdc;
        clip-path: inset(0 0 0 0);
        transition: clip-path 1s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #kl-intro.kl-lift { clip-path: inset(0 0 100% 0); }
      #kl-intro img {
        width: 132px; height: auto; opacity: 0; transform: translateY(10px);
        animation: kl-rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }
      #kl-intro .kl-word {
        margin-top: 14px; font: 400 10px/1 Helvetica, Arial, sans-serif; text-transform: uppercase;
        letter-spacing: 0.9em; padding-left: 0.9em; opacity: 0;
        animation: kl-settle 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      }
      #kl-intro .kl-line {
        margin-top: 26px; width: 120px; height: 1px; background: rgba(242, 235, 220, 0.16);
        overflow: hidden; position: relative;
      }
      #kl-intro .kl-line::after {
        content: ''; position: absolute; inset: 0; background: #f2ebdc;
        transform: scaleX(0); transform-origin: left;
        animation: kl-draw 1.25s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
      }
      @keyframes kl-rise { to { opacity: 1; transform: none; } }
      @keyframes kl-settle { to { opacity: 0.7; letter-spacing: 0.5em; padding-left: 0.5em; } }
      @keyframes kl-draw { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #kl-intro { display: none; } }
    </style>
  </head>
  <body>
    <div id="kl-intro" aria-hidden="true">
      <img src="/images/kiano-lockup-mark.png" alt="" width="807" height="351" />
      <span class="kl-word">London</span>
      <span class="kl-line"></span>
    </div>
    <script>
      (function () {
        var el = document.getElementById('kl-intro')
        var skip = /^\/(admin|checkout|order|sign-in|sign-up|api)/.test(location.pathname)
        var seen = false
        try { seen = sessionStorage.getItem('kl.intro') === '1' } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!el) return
        if (skip || seen || reduce) { el.parentNode.removeChild(el); return }
        try { sessionStorage.setItem('kl.intro', '1') } catch (e) {}
        document.documentElement.style.overflow = 'hidden'
        var start = Date.now()
        var lifted = false
        function lift() {
          if (lifted) return
          lifted = true
          var wait = Math.max(0, 1500 - (Date.now() - start))
          setTimeout(function () {
            el.classList.add('kl-lift')
            document.documentElement.style.overflow = ''
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el) }, 1100)
          }, wait)
        }
        window.__klIntroReady = lift
        setTimeout(lift, 4000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
